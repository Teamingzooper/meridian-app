[project]
name = "meridiand"
version = "0.1.0"
description = "Meridian sidecar: holds an iOS DVT location-simulation session and serves a local HTTP API"
requires-python = ">=3.10"
dependencies = ["pymobiledevice3>=11.0"]

[project.scripts]
meridiand = "meridiand.__main__:main"
meridian = "meridiand.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
