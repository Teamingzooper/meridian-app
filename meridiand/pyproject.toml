[project]
name = "meridiand"
version = "0.1.0"
description = "Meridian sidecar: holds an iOS DVT location-simulation session and serves a local HTTP API"
requires-python = ">=3.10"
dependencies = ["pymobiledevice3>=11.0"]

[project.optional-dependencies]
# pytest-asyncio is required: the simulator backend's tests are async.
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
meridiand = "meridiand.__main__:main"
meridian = "meridiand.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
